<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signup-form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="contents">
        <section class="left">
            <section class="logo"><img src="images/image.png" alt="odin-logo">odin</section>  
        </section>
        <section class="right">
            <section class="right-content">
                <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up now to get started.</p>
            <p class="p-know">You know you want to.</p>
            <form action="#" method="post">
                <fieldset>
                    <legend>Let's do this!</legend>
                    <div class="form-grid">
                    
                        <div class="input-group">
                        <label for="first_name">FIRST NAME</label>
                        <input type="text" name="first_name" placeholder="Thor" required>
                        </div>

                        <div class="input-group">
                        <label for="last_name">LAST NAME</label>
                        <input type="text" name="last_name" placeholder="Odinson" required>
                        </div>

                        <div class="input-group">
                        <label for="email">EMAIL</label>
                        <input type="email" name="email" required>
                        </div>

                        <div class="input-group">
                        <label for="phone_number">PHONE NUMBER</label>
                        <input type="tel" placeholder="098..." required>
                        </div>

                        <div class="input-group">
                        <label for="password">PASSWORD</label>
                        <input type="password" name="password" minlength="8" required>
                        </div>

                        <div class="input-group">
                        <label for="confirm_password">CONFIRM PASSWORD</label>
                        <input type="password" name="confirm_password" minlength="8" required>
                        </div>
                </div>
                </fieldset>
                

                <button type="submit">Create Account</button>
                </form>

           <span>Already have an account <a href="#">Log in</a></span>
            </section>
        </section>
    </section>
    <div class="footer">
        <p>copyright &copy; 2026 FeteDev <a href="https://github.com/fetehadin/"><img src="images/image copy.png" alt="github-logo"></a></p>
    </div>
</body>
</html>
